<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مینی‌اپ ماینکرفت</title>
<script src="https://tapi.bale.ai/miniapp.js?3"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101810;color:#fff;font-family:Tahoma,Arial,sans-serif;padding:20px}
.container{max-width:480px;margin:25px auto;background:#1c291c;border:1px solid #38543a;border-radius:20px;padding:22px;box-shadow:0 12px 35px #0008}
h2{text-align:center;color:#75df75;margin-top:5px}
.profile{display:flex;align-items:center;gap:12px;background:#293b29;padding:12px;border-radius:14px;margin-bottom:22px}
.profile img{width:55px;height:55px;border-radius:50%;object-fit:cover;background:#435943}
.profile-info{min-width:0}
.profile-info div{margin:5px 0;overflow-wrap:anywhere}
label{display:block;margin:15px 0 8px;color:#b8d9b8}
input,select{width:100%;padding:14px;border:1px solid #476647;border-radius:11px;background:#101b10;color:white;font-size:15px;outline:none}
button{width:100%;border:0;border-radius:12px;padding:15px;margin-top:20px;background:#4caf50;color:white;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}
.note{text-align:center;color:#a9b9a9;font-size:12px;margin-top:16px;line-height:2}
</style>
</head>
<body>
<div class="container">
<h2>⛏️ جست‌وجوی سرور ماینکرفت</h2>

<div class="profile">
<img id="avatar" alt="عکس پروفایل">
<div class="profile-info">
<div id="name">در حال دریافت پروفایل...</div>
<div id="username"></div>
<div id="userid"></div>
</div>
</div>

<label for="address">آدرس سرور</label>
<input id="address" type="text" placeholder="مثلاً play.example.com" maxlength="255">

<label for="edition">نوع سرور</label>
<select id="edition">
<option value="java">Minecraft Java</option>
<option value="bedrock">Minecraft Bedrock</option>
</select>

<button id="search">🔎 بررسی سرور و ارسال گزارش در بله</button>
<div class="note">پس از جست‌وجو، مینی‌اپ بسته می‌شود و گزارش سرور در همین گفت‌وگوی بات ارسال خواهد شد.</div>
</div>

<script>
const app = window.Bale && window.Bale.WebApp ? window.Bale.WebApp : null;

function showProfile(){
    if(!app) {
        document.getElementById("name").textContent="برای استفاده، از داخل بات بله وارد شوید.";
        return;
    }

    const user = app.initDataUnsafe && app.initDataUnsafe.user;
    if(!user) {
        document.getElementById("name").textContent="اطلاعات پروفایل در دسترس نیست.";
        return;
    }

    const fullName = [user.first_name,user.last_name].filter(Boolean).join(" ");
    document.getElementById("name").textContent=fullName || "کاربر بله";
    document.getElementById("username").textContent=user.username ? "@"+user.username : "نام کاربری ثبت نشده";
    document.getElementById("userid").textContent="شناسه: "+user.id;

    if(user.photo_url) {
        document.getElementById("avatar").src=user.photo_url;
    }
}

document.getElementById("search").addEventListener("click",()=>{
    const address=document.getElementById("address").value.trim();
    const edition=document.getElementById("edition").value;
    const button=document.getElementById("search");

    if(!address){
        alert("لطفاً آدرس سرور را وارد کن.");
        return;
    }

    if(!app || typeof app.sendData!=="function"){
        alert("این صفحه را از طریق دکمه مینی‌اپ در بات بله باز کن.");
        return;
    }

    button.disabled=true;
    button.textContent="در حال ارسال درخواست...";

    app.sendData(JSON.stringify({
        type:"server_lookup",
        address:address,
        edition:edition
    }));
});

if(app && typeof app.ready==="function") app.ready();
showProfile();
</script>
</body>
</html>
