
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جست‌وجوی اسکین ماینکرافت</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10151d;color:white;
 font-family:Tahoma,Arial,sans-serif;
 min-height:100vh;display:flex;
 justify-content:center;align-items:center;padding:18px
}
.container{
 width:100%;max-width:440px;background:#1b2430;
 border:1px solid #303e50;border-radius:22px;
 padding:24px;text-align:center
}
h2{margin:4px 0 12px}
.description{color:#aebdce;font-size:13px;line-height:2}
input{
 width:100%;padding:15px;border-radius:12px;
 border:1px solid #46576b;background:#101923;
 color:white;font-size:16px;text-align:center;
 outline:none;margin:15px 0
}
button{
 width:100%;padding:14px;border:0;border-radius:12px;
 background:#39a96b;color:white;font-size:15px;
 font-weight:bold;margin-top:10px;cursor:pointer
}
button:disabled{opacity:.5}
.secondary{background:#344458}
.hidden{display:none!important}
.status{font-size:13px;color:#b8c8d9;margin:14px 0;line-height:2}
.error{color:#ff7777}
.viewer{
 width:100%;height:360px;border:0;
 border-radius:15px;background:#111a25;
 margin-top:14px;display:block
}
.skin-image{
 width:100px;height:100px;object-fit:contain;
 image-rendering:pixelated;
 background:#111a25;border-radius:12px;margin:12px auto
}
.footer{font-size:11px;color:#7f91a5;margin-top:22px}
</style>
</head>

<body>
<div class="container">

 <div id="searchPanel">
  <h2>🎮 جست‌وجوی اسکین</h2>
  <div class="description">
   نام کاربری ماینکرافت را وارد کن تا اسکین بازیکن را پیدا کنیم.
  </div>

  <input id="username" maxlength="16"
   placeholder="Minecraft Username" autocomplete="off">

  <button id="searchButton" onclick="searchSkin()">
   🔎 جست‌وجوی اسکین
  </button>

  <div id="status" class="status"></div>
 </div>

 <div id="resultPanel" class="hidden">
  <h2 id="playerTitle">اسکین بازیکن</h2>

  <div class="description">
   نمایش سه‌بعدی اسکین بازیکن
  </div>

  <img id="skinImage" class="skin-image" alt="Skin">

  <iframe
   id="viewerFrame"
   class="viewer"
   allowfullscreen
   loading="eager">
  </iframe>

  <button class="secondary" onclick="reloadViewer()">
   🔄 بارگذاری دوباره
  </button>

  <button class="secondary" onclick="newSearch()">
   🔎 جست‌وجوی جدید
  </button>

  <button onclick="closeApp()">
   بازگشت
  </button>
 </div>

 <div class="footer">Shayan Minecraft 3D Viewer</div>
</div>

<script>
const API = "https://api.mcskin.me";
const VIEWER = "https://kurojs.github.io/McView3D/embed.html";

const $ = id => document.getElementById(id);

let currentPlayer = "";

function validName(name){
 return /^[a-zA-Z0-9_]{3,16}$/.test(name);
}

function status(message,error=false){
 $("status").textContent = message;
 $("status").className = "status" + (error ? " error" : "");
}

function showPlayer(username){
 currentPlayer = username;

 $("playerTitle").textContent = username;

 // تصویر مستقیم از mcskin.me
 $("skinImage").src =
  API + "/head/" + encodeURIComponent(username) + "?size=256";

 // نمایشگر سه‌بعدی مستقل
 $("viewerFrame").src =
  VIEWER + "?skin=" + encodeURIComponent(username) +
  "&width=400&height=400&animation=idle";

 $("searchPanel").classList.add("hidden");
 $("resultPanel").classList.remove("hidden");

 history.replaceState(
  {},
  "",
  "?view=3d&player=" + encodeURIComponent(username)
 );
}

function searchSkin(){
 const username = $("username").value.trim();

 if(!validName(username)){
  status("نام کاربری معتبر نیست.",true);
  return;
 }

 $("searchButton").disabled = true;
 $("searchButton").textContent = "در حال بررسی...";

 status("در حال بارگذاری اسکین...");

 // ابتدا بررسی می‌کنیم تصویر بازیکن موجود باشد
 const testImage = new Image();

 testImage.onload = function(){
  showPlayer(username);
  $("searchButton").disabled = false;
  $("searchButton").textContent = "🔎 جست‌وجوی اسکین";
 };

 testImage.onerror = function(){
  status("اسکین دریافت نشد. نام کاربری یا اتصال اینترنت را بررسی کن.",true);
  $("searchButton").disabled = false;
  $("searchButton").textContent = "🔎 جست‌وجوی اسکین";
 };

 testImage.src =
  API + "/head/" + encodeURIComponent(username) + "?size=128";
}

function reloadViewer(){
 if(currentPlayer){
  $("viewerFrame").src =
   VIEWER + "?skin=" + encodeURIComponent(currentPlayer) +
   "&width=400&height=400&animation=idle";
 }
}

function newSearch(){
 $("viewerFrame").src = "about:blank";
 $("skinImage").src = "";
 currentPlayer = "";

 $("resultPanel").classList.add("hidden");
 $("searchPanel").classList.remove("hidden");

 $("username").value = "";
 status("");

 history.replaceState({}, "", location.pathname);
}

function closeApp(){
 if(window.Bale?.WebApp?.close){
  window.Bale.WebApp.close();
 }else if(window.Telegram?.WebApp?.close){
  window.Telegram.WebApp.close();
 }else{
  history.back();
 }
}

$("username").addEventListener("keydown",e=>{
 if(e.key === "Enter") searchSkin();
});

const params = new URLSearchParams(location.search);
const player = params.get("player");

if(params.get("view") === "3d" && player && validName(player)){
 $("username").value = player;
 showPlayer(player);
}
</script>
</body>
</html>
