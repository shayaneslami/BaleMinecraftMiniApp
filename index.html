<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111318">
<title>جستجوی اسکین ماینکرفت</title>

<script src="https://cdn.jsdelivr.net/npm/skinview3d@3.4.2/bundles/skinview3d.bundle.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
 margin:0;background:#111318;color:#fff;
 font-family:Tahoma,Arial,sans-serif;min-height:100vh
}
.container{max-width:450px;margin:auto;padding:25px 18px}
.header{text-align:center;margin-top:65px;margin-bottom:35px}
.logo{font-size:55px}
h1{font-size:23px;margin:15px 0}
.subtitle{font-size:13px;color:#929baa;line-height:2}
.panel{
 background:#1c222c;border:1px solid #303a49;
 border-radius:18px;padding:20px
}
label{display:block;font-size:14px;margin-bottom:12px}
input{
 width:100%;height:54px;border-radius:12px;
 border:1px solid #424e60;background:#111720;
 color:white;padding:12px 15px;font-size:17px;
 direction:ltr;text-align:left;outline:none
}
input:focus{border-color:#339bfa}
button{
 width:100%;height:53px;border:0;border-radius:12px;
 font-size:15px;font-weight:bold;margin-top:13px;
 cursor:pointer
}
.primary{background:#2388ed;color:white}
.secondary{background:#303947;color:white}
.status{
 text-align:center;font-size:14px;
 line-height:2;margin-top:22px;min-height:30px
}
.success{color:#37d58a}
.error{color:#ff6565}
.hidden{display:none!important}
.actions{display:flex;gap:10px;margin-top:25px}
.actions button{flex:1}
.preview{
 height:min(68vh,540px);background:#171d27;
 border:1px solid #303947;border-radius:18px;
 margin:20px 0;overflow:hidden
}
canvas{width:100%;height:100%;display:block}
.viewer{max-width:600px}
.viewer .header{margin-top:25px;margin-bottom:20px}
.viewer-info{text-align:center;color:#aeb7c6;font-size:12px;line-height:2}
.footer{text-align:center;color:#697386;font-size:11px;margin-top:35px}
</style>
</head>

<body>
<div class="container" id="searchPage">

 <div class="header">
  <div class="logo">🎮</div>
  <h1>جستجوی اسکین ماینکرفت</h1>
  <div class="subtitle">
   نام کاربری بازیکن ماینکرفت را وارد کن
   <br>
   تا اسکین او را برایت پیدا کنیم.
  </div>
 </div>

 <div class="panel" id="searchPanel">
  <label for="username">نام کاربری بازیکن</label>
  <input id="username" maxlength="16"
   placeholder="Username"
   autocomplete="off" spellcheck="false">

  <button class="primary" id="searchButton">
   🔎 جستجوی اسکین
  </button>

  <div id="status" class="status"></div>
 </div>

 <div id="resultPanel" class="panel hidden">
  <div style="text-align:center;font-size:43px">✅</div>
  <div id="resultMessage" class="status success">
   گزارش اسکین در ربات ارسال شد!
  </div>

  <div class="actions">
   <button class="secondary" id="backButton">
    ↩ بازگشت
   </button>
   <button class="primary" id="newButton">
    🔎 جستجوی جدید
   </button>
  </div>
 </div>

 <div class="footer">Shayan Minecraft Skin</div>
</div>

<div class="container viewer hidden" id="viewerPage">
 <div class="header">
  <div class="logo">🧊</div>
  <h1>نمایش سه‌بعدی اسکین</h1>
  <div id="viewerUsername" class="subtitle"></div>
 </div>

 <div class="preview">
  <canvas id="skinCanvas"></canvas>
 </div>

 <div class="viewer-info">
  با لمس و کشیدن، بازیکن را از تمام جهت‌ها ببین.
  <br>
  برای بزرگ‌نمایی از زوم استفاده کن.
 </div>

 <button class="secondary" id="resetButton">
  🎯 تنظیم دوباره دوربین
 </button>

 <div class="footer">Shayan Minecraft 3D Viewer</div>
</div>

<script>
const params = new URLSearchParams(location.search);

const SITE =
 "https://shayaneslami.github.io/BaleMinecraftMiniApp/";

const STEVE =
 "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.21.4/assets/minecraft/textures/entity/player/wide/steve.png";

const ELY =
 "https://skinsystem.ely.by/skins/";

const token = params.get("token") || "";
const apiBase = (params.get("api") || "").replace(/\/+$/, "");

const $ = id => document.getElementById(id);

let busy = false;
let viewer = null;

function validName(name){
 return /^[a-zA-Z0-9_]{1,16}$/.test(name);
}

function setStatus(message,type=""){
 $("status").textContent=message;
 $("status").className="status "+type;
}

function showResult(){
 $("searchPanel").classList.add("hidden");
 $("resultPanel").classList.remove("hidden");
 $("resultMessage").textContent=
  "گزارش اسکین در ربات ارسال شد!";
}

function showSearch(){
 $("resultPanel").classList.add("hidden");
 $("searchPanel").classList.remove("hidden");
 $("username").value="";
 setStatus("");
}

async function searchSkin(){
 if(busy)return;

 const username=$("username").value.trim();

 if(!validName(username)){
  setStatus("نام کاربری معتبر نیست.","error");
  return;
 }

 if(!token || !apiBase.startsWith("https://")){
  setStatus("ارتباط با ربات برقرار نیست. دوباره /start بزن.","error");
  return;
 }

 busy=true;
 $("searchButton").disabled=true;
 $("searchButton").textContent="در حال جستجو...";
 setStatus("در حال جستجوی اسکین و ارسال به ربات...");

 try{
  const response=await fetch(apiBase+"/api/search",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    token:token,
    username:username
   })
  });

  const result=await response.json();

  if(!response.ok || !result.ok){
   throw new Error(result.message || "ارسال ناموفق بود.");
  }

  showResult();

 }catch(error){
  setStatus("❌ "+error.message,"error");
 }finally{
  busy=false;
  $("searchButton").disabled=false;
  $("searchButton").textContent="🔎 جستجوی اسکین";
 }
}

async function startViewer(){
 const username=params.get("player") || "Steve";

 $("searchPage").classList.add("hidden");
 $("viewerPage").classList.remove("hidden");
 $("viewerUsername").textContent=username;

 if(!window.skinview3d){
  $("viewerUsername").textContent="کتابخانه سه‌بعدی بارگذاری نشد.";
  return;
 }

 try{
  viewer=new skinview3d.SkinViewer({
   canvas:$("skinCanvas"),
   width:550,
   height:540,
   background:"#171d27"
  });

  viewer.controls.enableRotate=true;
  viewer.controls.enableZoom=true;
  viewer.controls.enablePan=true;
  viewer.zoom=0.85;

  let loaded=false;

  if(validName(username)){
   try{
    await viewer.loadSkin(
     ELY+encodeURIComponent(username)+".png"
    );
    loaded=true;
   }catch(e){
    console.log("Real skin unavailable; loading Steve.");
   }
  }

  if(!loaded){
   await viewer.loadSkin(STEVE);
  }

  viewer.animation=new skinview3d.IdleAnimation();

 }catch(error){
  console.error(error);
  $("viewerUsername").textContent="بارگذاری اسکین ممکن نشد.";
 }
}

$("searchButton").addEventListener("click",searchSkin);

$("username").addEventListener("keydown",event=>{
 if(event.key==="Enter")searchSkin();
});

$("newButton").addEventListener("click",showSearch);

$("backButton").addEventListener("click",()=>{
 if(window.Bale && window.Bale.WebApp &&
    typeof window.Bale.WebApp.close==="function"){
  window.Bale.WebApp.close();
 }else if(window.Telegram && window.Telegram.WebApp){
  window.Telegram.WebApp.close();
 }else{
  history.back();
 }
});

$("resetButton").addEventListener("click",()=>{
 if(viewer)viewer.resetCameraPose();
});

history.pushState({stay:true},"",location.href);

window.addEventListener("popstate",()=>{
 history.pushState({stay:true},"",location.href);
});

if(params.get("view")==="3d"){
 startViewer();
}
</script>
</body>
</html>
